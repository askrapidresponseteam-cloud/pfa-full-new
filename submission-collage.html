<!DOCTYPE html>
<html lang="en">
<head>
<!-- Marcellus self-hosted, same files as the home page, so every display heading renders identically even when Google Fonts is slow or blocked -->
<!-- Requested at parse time rather than when layout first needs it. Without this the
     browser does not ask for the file until it lays out a heading, which is why the
     display face arrived a beat late and swapped in over the fallback. Only the latin
     file: latin-ext covers characters these pages do not use. -->
<link rel="preload" href="fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>/* latin-ext */
@font-face {
  font-family: 'Marcellus';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("fonts/marcellus-latin-ext.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
/* latin */
@font-face {
  font-family: 'Marcellus';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("fonts/marcellus-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* What a cold load paints while Marcellus arrives is the next face in the
   stack, and the flash is the difference between the two: Georgia runs about
   2% wider per line and sits on different vertical metrics, so the swap
   rewrapped every heading and the boxes around them moved - the flash of
   unstyled text, back on every hard refresh. These two faces are Georgia and
   Times dressed in Marcellus's measurements (ascent 1995, descent 573, gap 0,
   weighted advance 932.4, all per 2048 em, read from the woff2 itself;
   Georgia 913, Times 832 per capsize). Scaled and overridden to occupy the
   same lines and the same boxes, the swap exchanges glyphs in place and
   moves nothing. The preload makes the window short; these make it
   invisible. Keep the numbers and the font in step: they are pinned by
   test/fout.test.js against the file on disk. */
@font-face {
  font-family: 'Marcellus Fallback';
  src: local('Georgia');
  size-adjust: 102.13%;
  ascent-override: 95.38%;
  descent-override: 27.39%;
  line-gap-override: 0%;
}
@font-face {
  font-family: 'Marcellus Fallback Times';
  src: local('Times New Roman'), local('Times'), local('Liberation Serif'), local('Tinos');
  size-adjust: 112.07%;
  ascent-override: 86.92%;
  descent-override: 24.96%;
  line-gap-override: 0%;
}
</style>
<meta charset="utf-8">
<meta name="pfa-build" content="v1.305">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Wall &middot; People for Animals</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #111; overflow: hidden; overscroll-behavior: none; }
  a { color:#111; } a:hover { color:#111; }
  /* Hidden only while the drawn cursor is live: the class is set by the same
     script that draws it, so a failure anywhere leaves the system cursor. */
  html.wall-cursor body, html.wall-cursor body * { cursor: none !important; }
  @keyframes wall-in { from { opacity: 0; } to { opacity: 1; } }
  .tile { flex: 0 0 auto; height: 100%; position: relative;
    filter: brightness(0.55) saturate(0.9);
    transition: filter .35s ease, transform .35s cubic-bezier(.22,1,.36,1); z-index: 1; }
  .tile:hover { filter: brightness(1.05) saturate(1); transform: scale(1.06);
    z-index: 10; box-shadow: 0 24px 60px rgba(0,0,0,.65); }
  .slot { position:absolute; inset:0; overflow:hidden;
    background:rgba(127,127,127,.08); background-size:cover; background-position:center;
    font:13px/1.3 system-ui,-apple-system,sans-serif; }
  .cap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:12px; box-sizing:border-box; text-align:center; color:#8a8a90;
    font-weight:500; letter-spacing:.01em; user-select:none; }
  #shuffleBtn:hover { background:rgba(255,255,255,.95); transform: scale(1.05); }
  #shuffleBtn:active { transform: scale(.94); }
  #backLink:hover { opacity: 1; }
</style>
</head>
<body>
<script>document.addEventListener('contextmenu',function(e){e.preventDefault();},true);</script>

<div id="stage" style="position:fixed;inset:0;background:#0a0a0c;overflow:hidden;perspective:1400px;font-family:Helvetica,Arial,sans-serif;cursor:grab;touch-action:none;user-select:none;">
  <div id="tilt" style="position:absolute;inset:0;animation:wall-in 1.6s ease both;transform-style:preserve-3d;">
    <div id="mover" style="position:absolute;left:0;top:0;will-change:transform;"></div>
  </div>
  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(5,5,7,.55) 100%);"></div>
  <a id="backLink" href="newsroom.html" style="position:absolute;top:24px;left:32px;z-index:20;color:#111;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;text-decoration:none;">&larr; Newsroom</a>
  <div style="position:absolute;top:24px;right:32px;pointer-events:none;color:#111;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;">Community Submissions</div>
  <button id="shuffleBtn" style="position:absolute;right:28px;bottom:26px;display:flex;align-items:center;gap:8px;background:rgba(18,18,22,.85);color:#f2f0eb;border:0;border-radius:14px;padding:12px 18px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:transform .2s ease,background .2s ease;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2f0eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path></svg>
    shuffle
  </button>
  <div style="position:fixed;inset:0;z-index:100;pointer-events:none;">
    <svg id="curSvg" width="40" height="40" viewBox="0 0 40 40" style="position:absolute;left:0;top:0;opacity:0;will-change:transform;overflow:visible;">
      <path id="curPath" d="" fill="none" stroke="#f2f0ec" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));"></path>
    </svg>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage'),
      tilt  = document.getElementById('tilt'),
      mover = document.getElementById('mover');

  var blockW = 3400, layout = null;

  /* Verbatim port of buildLayout() - Lehmer RNG, same constants. */
  function buildLayout(seedIn) {
    var seed = seedIn;
    function rng() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var GAP = 14, COLS = 8, ROWSN = 6, tileSum = blockW - COLS * GAP;
    var ids = [], i, j, t, r;
    for (i = 0; i < ROWSN * COLS; i++) ids.push(i);
    for (i = ids.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    }
    var rows = [], n = 0, blockH = 0;
    for (r = 0; r < ROWSN; r++) {
      var h = Math.round(155 + rng() * 110);
      blockH += h + GAP;
      var raw = [], s = 0;
      for (t = 0; t < COLS; t++) { var w0 = 170 + rng() * 260; raw.push(w0); s += w0; }
      var tiles = [], acc = 0;
      for (t = 0; t < COLS; t++) {
        var w = t === COLS - 1 ? tileSum - acc : Math.round(raw[t] * tileSum / s);
        acc += w;
        var k = ids[n++];
        tiles.push({ id: 'sub-' + Math.floor(k / COLS) + '-' + (k % COLS), w: w,
                     label: 'submission ' + (k + 1) });
      }
      rows.push({ h: h, tiles: tiles });
    }
    return { rows: rows, blockH: blockH,
      copies: [{x:0,y:0},{x:blockW,y:0},{x:0,y:blockH},{x:blockW,y:blockH}] };
  }

  function render() {
    var html = '';
    layout.copies.forEach(function (copy) {
      html += '<div style="position:absolute;left:' + copy.x + 'px;top:' + copy.y +
              'px;width:' + blockW + 'px;">';
      layout.rows.forEach(function (row) {
        html += '<div style="display:flex;gap:14px;height:' + row.h + 'px;margin-bottom:14px;">';
        row.tiles.forEach(function (tile) {
          html += '<div class="tile" style="width:' + tile.w + 'px;">' +
                  '<div class="slot" data-img="img/submissions/' + tile.id +
                  '.jpg" role="img" aria-label="' + tile.label +
                  '"><span class="cap">' + tile.label + '</span></div></div>';
        });
        html += '</div>';
      });
      html += '</div>';
    });
    mover.innerHTML = html;
  }

  function fillSlots() {
    mover.querySelectorAll('.slot[data-img]').forEach(function (el) {
      var src = el.getAttribute('data-img'), probe = new Image();
      probe.onload = function () {
        el.style.backgroundImage = "url('" + src + "')";
        var c = el.querySelector('.cap'); if (c) c.remove();
      };
      probe.src = src;
    });
  }

  layout = buildLayout(42);
  render(); fillSlots();

  /* ---- canvas position, inertia, parallax ---- */
  var cx = 400, cy = 300, vx = 0, vy = 0, mx = 0, my = 0, px = 0, py = 0,
      dragging = false, lastInput = 0, lx = 0, ly = 0, shuffling = false;

  stage.addEventListener('pointerdown', function (e) {
    /* A press that starts on a link or a button is not a drag. setPointerCapture
       below retargets the whole gesture to #stage, so the pointerup never lands
       on the control and the browser dispatches no click on it. That is why the
       back link did nothing: the anchor was never clicked, #stage was. */
    if (e.target.closest && e.target.closest('a, button')) return;
    dragging = true; lx = e.clientX; ly = e.clientY; vx = 0; vy = 0;
    lastInput = performance.now(); stage.style.cursor = 'grabbing';
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  addEventListener('pointerup', function () { dragging = false; stage.style.cursor = 'grab'; });
  addEventListener('pointermove', function (e) {
    mx = (e.clientX / innerWidth) * 2 - 1;
    my = (e.clientY / innerHeight) * 2 - 1;
    if (dragging) {
      var dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      cx -= dx; cy -= dy; vx = -dx; vy = -dy;
      lastInput = performance.now();
    }
  });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); cx += e.deltaX; cy += e.deltaY; lastInput = performance.now();
  }, { passive: false });

  function mod(v, m) { return ((v % m) + m) % m; }

  (function loop(now) {
    requestAnimationFrame(loop);
    var drift = true, inertia = 0.94, doTilt = true;
    if (!dragging) {
      cx += vx; cy += vy; vx *= inertia; vy *= inertia;
      if (drift && now - lastInput > 3000 && Math.abs(vx) + Math.abs(vy) < 0.5) {
        cx += 0.35; cy += Math.sin(now / 6000) * 0.25;
      }
    }
    px += (mx - px) * 0.05; py += (my - py) * 0.05;
    var parX = -px * 60, parY = -py * 50;
    var ox = -mod(cx, blockW), oy = -mod(cy, layout.blockH);
    mover.style.transform = 'translate3d(' + ox + 'px,' + oy + 'px,0)';
    var rotY = doTilt ? px * 3 + Math.max(-4, Math.min(4, -vx * 0.06)) : 0;
    var rotX = doTilt ? -py * 2.2 + Math.max(-4, Math.min(4, vy * 0.06)) : 0;
    tilt.style.transform = 'translate3d(' + parX + 'px,' + parY + 'px,0) rotateY(' +
                           rotY + 'deg) rotateX(' + rotX + 'deg)';
  })(0);

  /* ---- shuffle: spin-away, rebuild, fly-in ---- */
  function tileEls() { return [].slice.call(mover.querySelectorAll('.tile')); }

  document.getElementById('shuffleBtn').addEventListener('click', function () {
    if (shuffling) return;
    shuffling = true;
    var W = innerWidth, H = innerHeight, cxs = W / 2, cys = H / 2, R = Math.hypot(cxs, cys);
    var th = -0.14, cos = Math.cos(th), sin = Math.sin(th);
    tileEls().forEach(function (el) {
      var r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      if (x < -300 || x > W + 300 || y < -300 || y > H + 300) return;
      var dx0 = x - cxs, dy0 = y - cys;
      var dx = dx0 * cos - dy0 * sin - dx0, dy = dx0 * sin + dy0 * cos - dy0;
      var delay = (1 - Math.min(1, Math.hypot(dx0, dy0) / R)) * 90;
      el.animate([{ transform: 'translate(0px,0px) scale(1)' },
                  { transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(0.88)' }],
        { duration: 220, delay: delay, easing: 'cubic-bezier(0.5,0,0.9,0.55)',
          composite: 'add', fill: 'forwards' });
      el.animate([{ opacity: 1 }, { opacity: 0 }],
        { duration: 200, delay: delay + 15, easing: 'linear', fill: 'forwards' });
    });
    setTimeout(function () {
      cx = Math.random() * blockW; vx = 0; vy = 0;
      layout = buildLayout(1 + Math.floor(Math.random() * 2147483645));
      render(); fillSlots();
      cy = Math.random() * layout.blockH;
      requestAnimationFrame(function () {
        var th2 = 0.22, c2 = Math.cos(th2), s2 = Math.sin(th2);
        tileEls().forEach(function (el) {
          el.getAnimations().forEach(function (a) { a.cancel(); });
          var r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
          if (x < -300 || x > W + 300 || y < -300 || y > H + 300) return;
          var dx0 = x - cxs, dy0 = y - cys;
          var dx = dx0 * c2 - dy0 * s2 - dx0, dy = dx0 * s2 + dy0 * c2 - dy0;
          var delay = Math.min(1, Math.hypot(dx0, dy0) / R) * 240;
          el.animate([{ transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(0.86)' },
                      { transform: 'translate(0px,0px) scale(1)' }],
            { duration: 850, delay: delay, easing: 'cubic-bezier(0.16,1,0.3,1)',
              composite: 'add', fill: 'backwards' });
          el.animate([{ opacity: 0 }, { opacity: 1 }],
            { duration: 320, delay: delay, easing: 'linear', fill: 'backwards' });
        });
        shuffling = false;
      });
    }, 340);
  });

  /* ---- hand-drawn jittering cursor ---- */
  if (matchMedia('(hover: hover)').matches &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var svg = document.getElementById('curSvg'), path = document.getElementById('curPath');
    var curX = -100, curY = -100, curVisible = false, curDown = false, curRaf = 0;
    document.documentElement.classList.add('wall-cursor');
    function draw() {
      var j = 3.4, n = function () { return (Math.random() - 0.5) * 2 * j; };
      var pts = [[30 + n(), 4 + n()], [8 + n() * 0.6, 20 + n() * 0.5], [30 + n(), 36 + n()]];
      var th = 38 * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th), tip = pts[1];
      path.setAttribute('d', 'M' + pts.map(function (p) {
        var dx = p[0] - tip[0], dy = p[1] - tip[1];
        return (dx * cos - dy * sin).toFixed(1) + ' ' + (dx * sin + dy * cos).toFixed(1);
      }).join('L'));
    }
    draw();
    setInterval(function () { if (curVisible && !document.hidden) draw(); }, 130);
    function place() {
      curRaf = 0;
      svg.style.transform = 'translate(' + curX + 'px,' + curY + 'px) scale(' +
                            (curDown ? 0.82 : 1) + ')';
    }
    /* A gaming mouse reports moves far faster than the screen refreshes, and
       this page is already tilting the whole wall per move: one cursor style
       write per frame, never per event. */
    function schedule() { if (!curRaf) curRaf = requestAnimationFrame(place); }
    function hideCur() { curVisible = false; svg.style.opacity = '0'; }
    svg.style.transformOrigin = '0 0';
    svg.style.transition = 'opacity 0.2s ease';
    addEventListener('pointermove', function (e) {
      if (e.pointerType && e.pointerType !== 'mouse') { hideCur(); return; }
      curX = e.clientX; curY = e.clientY;
      if (!curVisible) { curVisible = true; svg.style.opacity = '1'; }
      schedule();
    }, { passive: true });
    addEventListener('pointerdown', function (e) {
      if (e.pointerType && e.pointerType !== 'mouse') { hideCur(); return; }
      curDown = true; schedule();
    });
    addEventListener('pointerup', function () { curDown = false; schedule(); });
    addEventListener('pointercancel', function () { curDown = false; schedule(); });
    addEventListener('blur', hideCur);
    document.documentElement.addEventListener('pointerleave', hideCur);
  }
})();
</script>
</body>
</html>
